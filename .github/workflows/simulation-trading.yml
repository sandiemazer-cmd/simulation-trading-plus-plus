name: Simulation trading

on:
  schedule:
    - cron: "1,16,31,46 * * * *"
  workflow_dispatch:

concurrency:
  group: simulation-trading
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas requests
      - name: Lancer le bot
        run: python bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_TRADING }}
      - name: Sauvegarder l'état
        run: |
          git config user.name "bot-simulation"
          git config user.email "bot@users.noreply.github.com"
          git add state.json trades.csv
          git commit -m "Simulation : mise à jour" || echo "Rien à sauvegarder"
          git pull --rebase && git push
